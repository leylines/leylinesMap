services:
  db:
    image: imresamu/postgis:17-3.6-alpine3.22
    env_file: ./.env
    container_name: leylines_db
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - ../postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_RO_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  leylinesmap:
    image: ghcr.io/leylines/leylinesmap:latest
    env_file: ./.env
    deploy:
      replicas: 4
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../leylines-config/serverconfig.json:/app/serverconfig.json:ro
      - ../leylines-config/config.json:/app/wwwroot/config.json:ro
      - ../leylines-config/leylines.json:/app/wwwroot/init/leylines.json:ro
      - ../leylines-config/leylines-stripped.json:/app/wwwroot/init/leylines-stripped.json:ro
      # Mount only the externally managed catalogs. Mounting the complete
      # directory would hide catalogs shipped in the Docker image.
      - ../leylines-config/catalogs/catalog-uvgGrids.json:/app/wwwroot/catalogs/catalog-uvgGrids.json:ro
      - ../leylines-config/catalogs/catalog-poleGrids.json:/app/wwwroot/catalogs/catalog-poleGrids.json:ro
      - ../leylines-config/catalogs/catalog-experimentalGrids.json:/app/wwwroot/catalogs/catalog-experimentalGrids.json:ro
      - ../leylines-geodata:/app/wwwroot/leylines-geodata:ro

  geoserver:
    image: kartoza/geoserver:latest
    volumes:
      - ../geoserver-data:/opt/geoserver/data_dir
    environment:
      GEOSERVER_ADMIN_PASSWORD: admin
      GEOSERVER_ADMIN_USER: admin
      SKIP_DEMO_DATA: "true"
      INITIAL_MEMORY: 2G
      MAXIMUM_MEMORY: 4G
      WEBAPP_CONTEXT: ""
      HTTP_PROXY_NAME: geoserver.localhost
      HTTP_SCHEME: http
      ROOT_WEBAPP_REDIRECT: "true"
    depends_on:
      db:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.geoserver.rule=Host(`geoserver.localhost`)"
      - "traefik.http.routers.geoserver.entrypoints=web"
      - "traefik.http.services.geoserver.loadbalancer.server.port=8080"
